<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 11</title>
    <link rel="stylesheet" href="style11.css">
</head>
<body>
    <main class="container">
        <h1>Contador com Laço de Repetição</h1>
        <p>Digite um número para gerar uma contagem de 1 até ele</p>
        <label for="limite">Número Final de Contagem</label>
        <input type="number" id="limite" min="1" max="100" placeholder="Digite um número entre 1 e 100">
        <div class="butao">
            <button onclick="geraConta()">Gerar Contagem</button>
            <button class="secun" onclick="limpaCampo()">Limpar</button>
        </div>
        <section class="painel-resultado">
            <h2>Resultado</h2>
            <p id="mensagem">Informe um número para começar.</p>
            <p id="resultado" aria-live="polite"></p>
        </section>
    </main>
    <div class="voltar-container" style="margin-top: 24px; text-align: center;">
        <a href="index.html" style="display:inline-block;padding:12px 20px;border-radius:999px;background:#5b36a8;color:#fff;text-decoration:none;font-weight:bold;">Voltar para seleção</a>
    </div>
    <script src="script11.js"></script>
</body>
</html>
